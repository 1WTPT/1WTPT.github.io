<!doctype html>
<html lang="ru" class="auth-pending">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="1WantToPiglet — вход">
<title>Вход — 1WantToPiglet</title>
<link rel="stylesheet" href="../assets/theme.css">
<script>
(function(){
  var mode=localStorage.getItem("wtp_theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  document.documentElement.dataset.theme=mode;
})();
</script>
</head>
<body>
<noscript><div class="auth-noscript">Для входа на сайт требуется JavaScript.</div></noscript>
<div class="login-topbar">
  <button class="theme-toggle" id="theme" aria-label="Сменить тему"><span class="switch"></span></button>
</div>
<main class="login-shell">
  <form class="panel corner-frame login-card" id="loginForm" autocomplete="off">
    <div class="login-brand">
      <svg class="brand-mark" viewBox="0 0 30 30" width="26" height="26"><circle cx="15" cy="15" r="12"/><path class="tick" d="M15 4v3M15 23v3M4 15h3M23 15h3" stroke-width="1.4" stroke-linecap="round"/><path class="needle" d="M15 15 L21 10" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>1WantToPiglet</span>
    </div>
    <p class="login-sub">Доступ к сайту защищён паролем. При входе сессия привязывается к вашему IP-адресу и сохраняется 5 дней — при смене сети пароль потребуется снова.</p>
    <div class="login-field">
      <label for="pass">Пароль</label>
      <input type="password" id="pass" name="pass" placeholder="Введите пароль" autocomplete="current-password" autofocus>
    </div>
    <button type="submit" class="login-btn" id="loginBtn">Войти</button>
    <div class="login-error" id="loginError">Неверный пароль. Попробуйте ещё раз.</div>
    <div class="login-foot">wantop.online · сессия по IP</div>
  </form>
</main>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../assets/vendor/jquery.plate.js"></script>
<script src="../assets/auth.js"></script>
<script src="../assets/site.js"></script>
<script>
(function(){
  function params(){ return new URLSearchParams(location.search); }

  var existing=WTPAuth.readAuth();
  if(existing && Date.now()<existing.expires){
    WTPAuth.fetchIP().then(function(ip){
      if(ip && ip===existing.ip){
        location.replace(WTPAuth.safeNext(params().get("next")));
      }else{
        WTPAuth.clearAuth();
        WTPAuth.reveal();
      }
    });
  }else{
    WTPAuth.reveal();
  }

  var form=document.getElementById("loginForm");
  var input=document.getElementById("pass");
  var btn=document.getElementById("loginBtn");
  var err=document.getElementById("loginError");
  var lockTimer=null;

  function formatRemaining(ms){
    var total=Math.max(0,Math.ceil(ms/1000));
    var m=Math.floor(total/60);
    var s=total%60;
    return m+":"+(s<10?"0":"")+s;
  }

  function applyLock(state){
    if(lockTimer){ clearInterval(lockTimer); lockTimer=null; }
    if(!state.locked){
      input.disabled=false;
      btn.disabled=false;
      btn.textContent="Войти";
      return;
    }
    input.disabled=true;
    btn.disabled=true;
    err.textContent="Слишком много неверных попыток. Попробуйте снова через "+formatRemaining(state.remainingMs)+".";
    err.classList.add("show");
    lockTimer=setInterval(function(){
      var s=WTPAuth.lockState();
      if(!s.locked){
        clearInterval(lockTimer);
        lockTimer=null;
        input.disabled=false;
        btn.disabled=false;
        btn.textContent="Войти";
        err.classList.remove("show");
        err.textContent="Неверный пароль. Попробуйте ещё раз.";
        input.focus();
        return;
      }
      err.textContent="Слишком много неверных попыток. Попробуйте снова через "+formatRemaining(s.remainingMs)+".";
    },1000);
  }

  applyLock(WTPAuth.lockState());

  form.addEventListener("submit",function(e){
    e.preventDefault();
    var initial=WTPAuth.lockState();
    if(initial.locked){ applyLock(initial); return; }
    var val=input.value;
    if(!val) return;
    btn.disabled=true;
    btn.textContent="Проверка…";
    err.classList.remove("show");
    err.textContent="Неверный пароль. Попробуйте ещё раз.";
    WTPAuth.login(val).then(function(state){
      if(state.ok){
        location.href=WTPAuth.safeNext(params().get("next"));
      }else if(state.locked){
        input.value="";
        applyLock(state);
      }else{
        btn.disabled=false;
        btn.textContent="Войти";
        if(state.attemptsLeft!=null && state.attemptsLeft<=2 && state.attemptsLeft>0){
          err.textContent="Неверный пароль. Осталось попыток: "+state.attemptsLeft+".";
        }
        err.classList.add("show");
        input.value="";
        input.focus();
      }
    }).catch(function(){
      btn.disabled=false;
      btn.textContent="Войти";
      err.classList.add("show");
    });
  });
})();
</script>
</body>
</html>
